name: CI

# Checks that need no AWS access: unit tests, Nextflow lint and the CDK TypeScript build.
# Deliberately no secrets, no cloud credentials and no pull_request_target, so it is safe to
# run on pull requests from forks. Third-party actions are pinned to commit SHAs.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Run tests
        run: python -m unittest discover -s tests -v

  nextflow-lint:
    name: Nextflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NXF_VER: '26.10.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Nextflow
        run: |
          curl -fsSL https://get.nextflow.io | bash
          ./nextflow -version
      - name: Lint pipeline and config
        run: ./nextflow lint main.nf modules conf nextflow.config smoke
      - name: Check every container is pinned by digest
        run: scripts/check-image-pins.sh ./nextflow

  infra-typecheck:
    name: CDK type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: cdk-nag security checks
        run: npx jest
